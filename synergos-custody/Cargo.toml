[package]
name = "synergos-custody"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Opaque durable object custody for authorized Curare Server operations"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "rt"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
chrono = "0.4"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
