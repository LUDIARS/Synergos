[package]
name = "synergos-admin-ui"
version = "0.1.0"
edition = "2021"
description = "Synergos 管理コンソール (Dioxus 0.7 / WASM) — synergos-control の /ui/ から配信する"
publish = false

# wasm32-unknown-unknown 専用クレート。ルート workspace からは `exclude` されている
# (ホストターゲットの `cargo build --workspace` を壊さないため)。
[dependencies]
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
