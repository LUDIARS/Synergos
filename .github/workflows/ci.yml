name: Rust audit

# Rust のテスト・lint は廃止 (Rust は C++ へ移行中、neco 2026-10-30)。
# 移行が終わるまで依存の脆弱性監査だけ残す。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  audit:
    runs-on: ubuntu-latest
    name: Security audit
    # transitive dep の脆弱性 (rustls / quinn / hickory 等) は upstream 追従で
    # しか直せないケースが多い。CI では情報提供として毎回走らせるが、
    # merge をブロックしない運用にする。定期的に手でチェックして pin し直す。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo audit
        run: cargo audit
      - name: Run admin UI cargo audit
        run: cargo audit --file synergos-admin-ui/Cargo.lock
